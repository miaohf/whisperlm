# WhisperLM 配置文件
# 复制此文件为 config.yaml 并根据需要修改：
#   cp config.example.yaml config.yaml

# ─────────────────────────────────────────────────────────────
# 服务配置
# ─────────────────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8001
  workers: 1

# ─────────────────────────────────────────────────────────────
# WhisperX 配置
# ─────────────────────────────────────────────────────────────
whisperx:
  model: "large-v3"       # tiny / base / small / medium / large-v2 / large-v3
  device: "cuda"          # cuda / cpu
  compute_type: "float16" # float16（精度最高，~8GB显存）/ int8（最省显存，~5GB）
  batch_size: 16          # 8GB GPU 推荐 16；16GB+ 可提高到 24-32
  language: null          # 自动检测；或指定如 "en"、"zh"

  # （可选）对齐模型配置：若某语言默认模型加载失败，可手动指定替代模型
  # 留空则加载失败时自动跳过词级时间戳，转录照常进行
  # align_models:
  #   zh: "MKK/wav2vec2-large-xlsr-53-chinese-zh-cn-gpt"
  #   en: "WAV2VEC2_ASR_BASE_960H"

# ─────────────────────────────────────────────────────────────
# 说话人分离配置（基于 pyannote）
# ─────────────────────────────────────────────────────────────
diarization:
  enabled: true
  # 优先级：此处填写 > .env 文件 HF_TOKEN > 系统环境变量 HF_TOKEN
  # 申请权限：https://huggingface.co/pyannote/speaker-diarization-3.1
  huggingface_token: "${HF_TOKEN}"
  min_speakers: null      # null 为自动；会议等场景建议指定
  max_speakers: null

# ─────────────────────────────────────────────────────────────
# LLM 配置（语义优化 & 翻译）
# ─────────────────────────────────────────────────────────────
llm:
  enabled: false          # 设为 true 以启用 LLM 后处理
  provider: "vllm"        # vllm / openai / ollama / azure / anthropic
  model: "Qwen/Qwen3-32B"
  base_url: "http://localhost:8000/v1"  # vLLM 服务地址
  api_key: ""             # 本地 vLLM 无需 key；OpenAI 等需要填写
  timeout: 120            # 单次请求超时秒数
  max_retries: 3

  # 功能开关（仅在 enabled: true 时生效）
  features:
    semantic_segmentation: true   # 按语义边界智能断句/合并
    error_correction: true        # 修复 ASR 识别错误
    expression_optimization: true # 优化口语表达

# ─────────────────────────────────────────────────────────────
# 翻译配置（全局默认值，接口参数可覆盖）
# ─────────────────────────────────────────────────────────────
translation:
  enabled: false
  target_language: "zh"   # 目标语言代码
  style: "natural"        # natural / formal / casual

# ─────────────────────────────────────────────────────────────
# 输出配置
# ─────────────────────────────────────────────────────────────
output:
  formats: ["json", "srt", "vtt"]
  include_word_timestamps: true
  include_confidence: true
